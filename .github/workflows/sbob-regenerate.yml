name: sbob-regenerate

# M6 dogfood lane (SBOB-Forge TDS 10.3, org decision #26): regenerate the
# committed behavior profiles with sbobforge at a pinned SBOB-Forge ref and
# open a PR with the result. Drift is fixed by re-running the generator,
# never by hand-editing.
#
# Both profiles are re-bound together at a version cut:
#   - nuget-bound linux profile  (sbobforge.json         -> sbob/develapp-minotaur.linux.*)
#   - choco-bound windows profile (sbobforge-choco.json -> sbob/develapp-minotaur.windows.*)
#
# Release flow: run this with the version being cut (bumps both configs'
# packageVersion -> re-emits both sbob/ profiles + provenance + coverage,
# lock frozen), merge the PR, then tag the release. sbob-publish.yml then
# drift-gates the merged profiles and publishes them to the registry.
#
# Manual dispatch only: the version is a release decision, not an event
# to react to.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'DevelApp.Minotaur version the profiles are bound to (e.g. 1.5.26)'
        required: true
        type: string
      sbob-forge-ref:
        description: 'SBOB-Forge ref to build the sbobforge generator from'
        required: false
        default: '3bf45fc9f2b00548335a86993b1b529009b847c4'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout SBOB-Forge (generator)
        uses: actions/checkout@v5
        with:
          repository: DevelApp-ai/SBOB-Forge
          ref: ${{ inputs.sbob-forge-ref }}
          path: sbobforge-repo

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore + build sbobforge
        working-directory: sbobforge-repo
        shell: bash
        env:
          # Org decision #8: GitHub Packages reads authenticate with the org
          # secret, falling back to GITHUB_TOKEN (packages: read).
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          dotnet restore
          dotnet build --no-restore -warnaserror

      - name: Bind both profiles to the target version
        shell: bash
        run: |
          set -euo pipefail
          for cfg in sbobforge.json sbobforge-choco.json; do
            tmp="$(mktemp)"
            jq --arg v "${{ inputs.version }}" '.packageVersion = $v' "$cfg" > "$tmp"
            mv "$tmp" "$cfg"
            grep -q "\"packageVersion\": \"${{ inputs.version }}\"" "$cfg"
          done

      - name: Regenerate both profiles (lock frozen) + self-validate
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --no-build --project sbobforge-repo/src/SBOBForge.Cli -- generate . --frozen
          dotnet run --no-build --project sbobforge-repo/src/SBOBForge.Cli -- \
            generate . --frozen --config sbobforge-choco.json
          dotnet run --no-build --project sbobforge-repo/src/SBOBForge.Cli -- validate sbob/develapp-minotaur.linux.sbob.yaml
          dotnet run --no-build --project sbobforge-repo/src/SBOBForge.Cli -- validate sbob/develapp-minotaur.windows.sbob.yaml

      - name: Open the regeneration PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          FORGE_REF: ${{ inputs.sbob-forge-ref }}
        run: |
          set -euo pipefail
          branch="sbob/regenerate-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add sbobforge.json sbobforge-choco.json sbob/
          if git diff --cached --quiet; then
            echo "profiles already current for $VERSION — nothing to regenerate"
            exit 0
          fi
          git commit -m "sbob: regenerate profiles for DevelApp.Minotaur $VERSION (sbobforge $FORGE_REF, lock frozen)"
          git push origin "$branch"

          cat > /tmp/pr-body.md <<'EOF'
          Regenerated by the `sbob-regenerate` workflow (org decision #26: generated artifacts are committed and drift-gated; drift is fixed by re-running the generator, never hand-editing).

          - **Bound packages:** `PACKAGE_PURL` + `CHOCO_PURL`
          - **Generator:** sbobforge at SBOB-Forge ref `FORGE_REF` (grammar lock frozen — `--frozen` refuses a lock change)
          - **Files:** `sbob/develapp-minotaur.linux.*` + `sbob/develapp-minotaur.windows.*` (profiles + provenance + coverage sidecars), `sbobforge.json` + `sbobforge-choco.json` (packageVersion)
          - **Next:** after this merges, the release lanes (`sbob-publish.yml` for the registry, `sbob-choco.yml` for the Chocolatey package) drift-gate the committed profiles and publish them.

          Review the behavior diff like any other change — the profiles are the packages' public behavior declaration.
          EOF
          sed -i \
            -e "s|PACKAGE_PURL|pkg:nuget/develapp.minotaur@$VERSION|g" \
            -e "s|CHOCO_PURL|pkg:choco/develapp.minotaur@$VERSION|g" \
            -e "s|FORGE_REF|$FORGE_REF|g" \
            /tmp/pr-body.md

          gh pr create \
            --base main \
            --head "$branch" \
            --title "sbob: regenerate profiles for DevelApp.Minotaur $VERSION" \
            --body-file /tmp/pr-body.md
