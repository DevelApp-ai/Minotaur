name: sbob-regenerate

# M6 dogfood lane (SBOB-Forge TDS 10.3, org decision #26): regenerate the
# committed behavior profile with sbobforge at a pinned SBOB-Forge ref and
# open a PR with the result. Drift is fixed by re-running the generator,
# never by hand-editing.
#
# Release flow: run this with the version being cut (bumps sbobforge.json
# packageVersion -> re-emits sbob/ profile + provenance + coverage, lock
# frozen), merge the PR, then tag the release. sbob-publish.yml then
# drift-gates the merged profile and publishes it to the registry.
#
# Manual dispatch only: the version is a release decision, not an event
# to react to.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'DevelApp.Minotaur version the profile is bound to (e.g. 1.5.26)'
        required: true
        type: string
      sbob-forge-ref:
        description: 'SBOB-Forge ref to build the sbobforge generator from'
        required: false
        default: 'ae7c3068e9030dc0d38f1832d61fa4d0345838cb'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout SBOB-Forge (generator)
        uses: actions/checkout@v5
        with:
          repository: DevelApp-ai/SBOB-Forge
          ref: ${{ inputs.sbob-forge-ref }}
          path: sbobforge-repo

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore + build sbobforge
        working-directory: sbobforge-repo
        shell: bash
        env:
          # Org decision #8: GitHub Packages reads authenticate with the org
          # secret, falling back to GITHUB_TOKEN (packages: read).
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          dotnet restore
          dotnet build --no-restore -warnaserror

      - name: Bind the profile to the target version
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          jq --arg v "${{ inputs.version }}" '.packageVersion = $v' sbobforge.json > "$tmp"
          mv "$tmp" sbobforge.json
          grep -q "\"packageVersion\": \"${{ inputs.version }}\"" sbobforge.json

      - name: Regenerate the profile (lock frozen) + self-validate
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --no-build --project sbobforge-repo/src/SBOBForge.Cli -- generate . --frozen
          dotnet run --no-build --project sbobforge-repo/src/SBOBForge.Cli -- validate sbob/develapp-minotaur.linux.sbob.yaml

      - name: Open the regeneration PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          FORGE_REF: ${{ inputs.sbob-forge-ref }}
        run: |
          set -euo pipefail
          branch="sbob/regenerate-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add sbobforge.json sbob/
          if git diff --cached --quiet; then
            echo "profile already current for $VERSION — nothing to regenerate"
            exit 0
          fi
          git commit -m "sbob: regenerate profile for DevelApp.Minotaur $VERSION (sbobforge $FORGE_REF, lock frozen)"
          git push origin "$branch"

          cat > /tmp/pr-body.md <<'EOF'
          Regenerated by the `sbob-regenerate` workflow (org decision #26: generated artifacts are committed and drift-gated; drift is fixed by re-running the generator, never hand-editing).

          - **Bound package:** `PACKAGE_PURL`
          - **Generator:** sbobforge at SBOB-Forge ref `FORGE_REF` (grammar lock frozen — `--frozen` refuses a lock change)
          - **Files:** `sbob/develapp-minotaur.linux.sbob.yaml`, provenance + coverage sidecars, `sbobforge.json` (packageVersion)
          - **Next:** after this merges, the release lane (`sbob-publish.yml`) drift-gates the committed profile and publishes it to the SBoB registry.

          Review the behavior diff like any other change — the profile is the package's public behavior declaration.
          EOF
          sed -i \
            -e "s|PACKAGE_PURL|pkg:nuget/develapp.minotaur@$VERSION|g" \
            -e "s|FORGE_REF|$FORGE_REF|g" \
            /tmp/pr-body.md

          gh pr create \
            --base main \
            --head "$branch" \
            --title "sbob: regenerate profile for DevelApp.Minotaur $VERSION" \
            --body-file /tmp/pr-body.md
