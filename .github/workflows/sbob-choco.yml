name: sbob-choco

# M6 choco lane (SBOB-Forge TDS 10.3): build, verify, and ship the Chocolatey
# package for the full Minotaur product, dogfooding the choco channel end to
# end:
#
#   bootstrap-profile — generate the choco-bound Windows profile
#     (pkg:choco/develapp.minotaur@<v>, target-os windows, config
#     sbobforge-choco.json) with sbobforge. On a pull request the generated
#     profile is committed to the PR branch (org decision #26: generated
#     artifacts are committed and drift-gated); on push/release the same job
#     runs in --check mode — drift fails the build, the fix is re-running the
#     generator, never hand-editing.
#
#   choco-pack (windows-latest) — publish the win-x64 closure of Minotaur.Demo
#     (DevelApp.Minotaur with its dependency tree + the demo CLI entry point),
#     stage the committed profile at tools/sbob/ (the SBoB is DATA, not
#     behavior: install scripts never act on it), choco pack at the
#     profile-bound version, assert the embed and the purl binding inside the
#     nupkg, then a real choco install / uninstall round-trip on the runner:
#     the sbob copy and the minotaur shim must appear and disappear.
#
#   choco-release (stable release published) — attach the nupkg to the release
#     as an asset. Distribution is GitHub release assets only, mirroring the
#     NuGet package policy (GitHub Packages only, no public registry publish);
#     there is intentionally no chocolatey.org publish step.
#
# Both profiles (nuget: sbobforge.json, choco: sbobforge-choco.json) are
# re-bound together by the sbob-regenerate workflow at a version cut.

on:
  pull_request:
    branches: [ main ]
    paths: [ 'sbobforge-choco.json', 'sbob/**', 'choco/**', '.github/workflows/sbob-choco.yml' ]
  push:
    branches: [ main ]
    paths: [ 'sbobforge-choco.json', 'sbob/**', 'choco/**', '.github/workflows/sbob-choco.yml' ]
  release:
    types: [ published ]

permissions:
  contents: write   # bootstrap commits the generated profile to the PR branch; release job attaches the nupkg
  packages: read    # restore DevelApp packages from GitHub Packages (org decision #8)

env:
  # SBOB-Forge ref the generator is built from — pinned; bump deliberately.
  SBOB_FORGE_REF: 58beae61547e8fea98137132fb3cc12320c35025
  DOTNET_VERSION: '8.0.x'

jobs:
  bootstrap-profile:
    runs-on: ubuntu-latest
    steps:
      # PR head on pull_request so the generated profile can be committed to
      # the branch; the pushed ref / release tag on the other triggers.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Checkout SBOB-Forge (generator)
        uses: actions/checkout@v5
        with:
          repository: DevelApp-ai/SBOB-Forge
          ref: ${{ env.SBOB_FORGE_REF }}
          path: sbobforge-repo

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore + build sbobforge
        working-directory: sbobforge-repo
        shell: bash
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          dotnet restore
          dotnet build --no-restore -warnaserror

      - name: Generate / drift-check the choco-bound Windows profile
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Generate now, commit below (org decision #26).
            dotnet run --no-build --project sbobforge-repo/src/SBOBForge.Cli -- \
              generate . --frozen --config sbobforge-choco.json
            dotnet run --no-build --project sbobforge-repo/src/SBOBForge.Cli -- \
              validate sbob/develapp-minotaur.windows.sbob.yaml
          else
            # push/release: the committed profile must be exactly what the
            # generator would emit — drift fails the build (#26).
            dotnet run --no-build --project sbobforge-repo/src/SBOBForge.Cli -- \
              generate . --check --frozen --config sbobforge-choco.json
          fi

      - name: Commit the generated profile to the PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sbob/develapp-minotaur.windows.sbob.yaml \
                  sbob/develapp-minotaur.windows.provenance.jsonl \
                  sbob/develapp-minotaur.windows.coverage.json
          if git diff --cached --quiet; then
            echo "choco-bound profile already current — nothing to commit"
            exit 0
          fi
          git commit -m "sbob: generate choco-bound windows profile (sbobforge $SBOB_FORGE_REF, lock frozen)"
          git push origin "HEAD:${{ github.head_ref }}"

  choco-pack:
    needs: [ bootstrap-profile ]
    runs-on: windows-latest
    steps:
      # PR head so the bootstrap job's commit (if any) is included.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Checkout SBOB-Forge (generator)
        uses: actions/checkout@v5
        with:
          repository: DevelApp-ai/SBOB-Forge
          ref: ${{ env.SBOB_FORGE_REF }}
          path: sbobforge-repo

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore + build sbobforge
        working-directory: sbobforge-repo
        shell: bash
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          dotnet restore
          dotnet build --no-restore -warnaserror

      - name: Drift gate + validate + public-lane gate on the choco profile
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --no-build --project sbobforge-repo/src/SBOBForge.Cli -- \
            generate . --check --frozen --config sbobforge-choco.json
          dotnet run --no-build --project sbobforge-repo/src/SBOBForge.Cli -- \
            validate sbob/develapp-minotaur.windows.sbob.yaml
          dotnet run --no-build --project sbobforge-repo/src/SBOBForge.Cli -- \
            gate sbob/develapp-minotaur.windows.sbob.yaml

      - name: Publish the win-x64 product closure (full Minotaur + demo CLI)
        shell: bash
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          dotnet publish src/Minotaur.Demo -c Release -r win-x64 --self-contained false -o choco/tools/minotaur

      - name: Stage the committed SBoB at tools/sbob (data, not behavior)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path choco/tools/sbob | Out-Null
          Copy-Item sbob/develapp-minotaur.windows.sbob.yaml choco/tools/sbob/
          Copy-Item sbob/develapp-minotaur.windows.provenance.jsonl choco/tools/sbob/
          Copy-Item sbob/develapp-minotaur.windows.coverage.json choco/tools/sbob/

      - name: choco pack at the profile-bound version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content sbobforge-choco.json | ConvertFrom-Json).packageVersion
          $nuspecPath = "$PWD/choco/develapp.minotaur.nuspec"
          $nuspec = Get-Content -Raw $nuspecPath
          $nuspec = $nuspec -replace '<version>[^<]*</version>', "<version>$version</version>"
          Set-Content -Path $nuspecPath -Value $nuspec -NoNewline
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          choco pack choco/develapp.minotaur.nuspec --output-directory=dist
          if ($LASTEXITCODE -ne 0) { throw "choco pack failed" }
          if (-not (Test-Path "dist/develapp.minotaur.$version.nupkg")) { throw "expected dist/develapp.minotaur.$version.nupkg" }

      - name: Assert the embed and the purl binding inside the nupkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content sbobforge-choco.json | ConvertFrom-Json).packageVersion
          $nupkg = "$PWD/dist/develapp.minotaur.$version.nupkg"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg)
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -eq 'tools/sbob/develapp-minotaur.windows.sbob.yaml' }
            if (-not $entry) { throw "nupkg does not embed tools/sbob/develapp-minotaur.windows.sbob.yaml (TDS 10.3 choco lane)" }
            $reader = New-Object System.IO.StreamReader($entry.Open())
            $profile = $reader.ReadToEnd()
            $reader.Close()
            if (-not $profile.Contains("imageID: pkg:choco/develapp.minotaur@$version")) {
              throw "embedded profile is not bound to pkg:choco/develapp.minotaur@$version"
            }
            Write-Output "nupkg embeds the choco-bound profile (pkg:choco/develapp.minotaur@$version)"
          } finally {
            $zip.Dispose()
          }

      - name: choco install / uninstall round-trip (shim + sbob data)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # --ignore-dependencies: the runner already carries the .NET 8 runtime;
          # the dotnet-8.0-runtime dependency is exercised in a real consumer
          # environment, not against the community feed from CI.
          choco install develapp.minotaur --source="'dist'" -y --no-progress --ignore-dependencies
          if ($LASTEXITCODE -ne 0) { throw "choco install failed" }
          $installed = "$env:ChocolateyInstall/lib/develapp.minotaur/tools/sbob/develapp-minotaur.windows.sbob.yaml"
          if (-not (Test-Path $installed)) { throw "SBoB data not installed at $installed" }
          if (-not (Get-Command minotaur -ErrorAction SilentlyContinue)) { throw "minotaur shim not on PATH" }
          Write-Output "installed: sbob data at lib\develapp.minotaur\tools\sbob\ + minotaur shim on PATH"
          choco uninstall develapp.minotaur -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco uninstall failed" }
          if (Test-Path $installed) { throw "SBoB data survived uninstall" }
          Write-Output "uninstalled clean"

      - name: Upload the nupkg as a workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: choco-nupkg
          path: dist/*.nupkg

  choco-release:
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    needs: [ choco-pack ]
    runs-on: ubuntu-latest
    steps:
      - name: Download the packed nupkg
        uses: actions/download-artifact@v7
        with:
          name: choco-nupkg
          path: dist

      - name: Assert the profile version matches the release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          if [ ! -f "dist/develapp.minotaur.$tag.nupkg" ]; then
            echo "no develapp.minotaur.$tag.nupkg: the choco profile is not bound to the release version."
            echo "run sbob-regenerate with version $tag, merge its PR, then re-cut the release."
            exit 1
          fi

      - name: Attach the nupkg to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" dist/*.nupkg --clobber
          echo "choco nupkg attached to ${{ github.event.release.tag_name }}"
