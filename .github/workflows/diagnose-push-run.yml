name: diagnose-push-run

# Probe branch (throwaway): report which registry/org secrets are visible
# to this repo. Prints SET/EMPTY only — never secret values.

on:
  push:
    branches: [ probe/push-run-diagnosis ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Probe secret presence (SET/EMPTY only)
        env:
          S1: ${{ secrets.SBOB_PRIVATE_REGISTRY_TOKEN }}
          S2: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          S3: ${{ secrets.PACKAGES_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diag
          {
            if [ -n "$S1" ]; then echo "SBOB_PRIVATE_REGISTRY_TOKEN: SET"; else echo "SBOB_PRIVATE_REGISTRY_TOKEN: EMPTY"; fi
            if [ -n "$S2" ]; then echo "SBOB_REGISTRY_TOKEN: SET"; else echo "SBOB_REGISTRY_TOKEN: EMPTY"; fi
            if [ -n "$S3" ]; then echo "PACKAGES_READ_TOKEN: SET"; else echo "PACKAGES_READ_TOKEN: EMPTY"; fi
          } | tee diag/secrets.txt

      - name: Commit diag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diag/
          git commit -m "diag: secret presence probe" || echo "nothing to commit"
          git push origin HEAD:probe/push-run-diagnosis
