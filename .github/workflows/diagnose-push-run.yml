name: diagnose-push-run

# Throwaway probe: ONE-SHOT chain-dispatch of the sbob publish lanes for the
# release whose profiles are bound on main (v1.5.27), then dump run state.

on:
  push:
    branches: [ 'probe/push-run-diagnosis' ]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Dispatch the v1.5.27 publish lanes + dump state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diag
          : > diag/dispatch.txt
          gh workflow run sbob-publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.5.27 >> diag/dispatch.txt 2>&1 \
            || echo "sbob-publish dispatch FAILED" >> diag/dispatch.txt
          gh workflow run sbob-choco.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.5.27 >> diag/dispatch.txt 2>&1 \
            || echo "sbob-choco dispatch FAILED" >> diag/dispatch.txt
          echo "dispatched; waiting 30s" >> diag/dispatch.txt
          sleep 30
          gh run list --repo "$GITHUB_REPOSITORY" --limit 15 >> diag/dispatch.txt 2>&1 || true

      - name: Commit the dump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diag
          git commit -m "diag: v1.5.27 lane dispatch (token-scope fix verified)" || echo "nothing to commit"
          git push origin HEAD:probe/push-run-diagnosis
