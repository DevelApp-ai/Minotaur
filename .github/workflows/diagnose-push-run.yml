name: diagnose-push-run

# Probe branch (throwaway): push-triggered lane dispatcher. GITHUB_TOKEN
# cannot fire the `release` event, but it CAN dispatch workflow_dispatch
# (GitHub changelog 2022-09-08) — this is how the sbob lanes get re-run for
# an already-cut release tag without touching main. Each push to this branch
# re-dispatches both lanes for TAG below.

on:
  push:
    branches: [ probe/push-run-diagnosis ]
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

env:
  TAG: v1.5.27

jobs:
  dispatch-sbob-lanes:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sbob-publish + sbob-choco for the TAG against main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run sbob-publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
          gh workflow run sbob-choco.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
          echo "dispatched both sbob lanes for $TAG against main"
