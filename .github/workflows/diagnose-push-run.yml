name: diagnose-push-run

# Probe branch (throwaway): test whether the SBOB_REGISTRY_TOKEN org secret
# can write to the PRIVATE registry (DevelApp-Repo-Global). Creates and
# deletes a throwaway ref probe/token-test; prints only YES/NO verdicts,
# never secret values.

on:
  push:
    branches: [ probe/push-run-diagnosis ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cross-repo token capability test
        env:
          T1: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          T2: ${{ secrets.SBOB_PRIVATE_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diag
          {
            echo "== SBOB_REGISTRY_TOKEN vs DevelApp-ai/DevelApp-Repo-Global =="
            if [ -n "$T1" ]; then
              export GH_TOKEN="$T1"
              if db="$(gh api repos/DevelApp-ai/DevelApp-Repo-Global --jq .default_branch 2>/dev/null)" && [ -n "$db" ]; then
                echo "READ: YES (default branch: $db)"
                sha="$(gh api "repos/DevelApp-ai/DevelApp-Repo-Global/git/ref/heads/$db" --jq .object.sha 2>/dev/null || true)"
                if [ -n "$sha" ] && gh api -X POST repos/DevelApp-ai/DevelApp-Repo-Global/git/refs -f ref=refs/heads/probe/token-test -f sha="$sha" >/dev/null 2>&1; then
                  gh api -X DELETE repos/DevelApp-ai/DevelApp-Repo-Global/git/refs/heads/probe/token-test >/dev/null 2>&1 || true
                  echo "WRITE: YES (throwaway ref created + deleted)"
                else
                  echo "WRITE: NO"
                fi
              else
                echo "READ: NO (token cannot see the private registry repo)"
              fi
            else
              echo "T1: EMPTY"
            fi
            if [ -n "$T2" ]; then echo "SBOB_PRIVATE_REGISTRY_TOKEN: SET"; else echo "SBOB_PRIVATE_REGISTRY_TOKEN: EMPTY"; fi
          } | tee diag/token-test.txt

      - name: Commit diag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diag/
          git commit -m "diag: cross-repo token capability test" || echo "nothing to commit"
          git push origin HEAD:probe/push-run-diagnosis
