name: diagnose-push-run

# Throwaway probe: dumps recent run state AND chain-dispatches the sbob
# registry publish lanes for v1.5.27 (the stable release whose profiles are
# bound on main). Commits the dump to this branch for reading via API.

on:
  push:
    branches: [ 'probe/push-run-diagnosis' ]
  workflow_dispatch:

permissions:
  actions: write   # gh workflow run (chain dispatch, GITHUB_TOKEN)
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Dump run state + dispatch the v1.5.27 publish lanes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diag
          echo "== runs BEFORE dispatch ==" > diag/runs.txt
          gh run list --repo "$GITHUB_REPOSITORY" --limit 25 >> diag/runs.txt 2>&1 || true

          : > diag/dispatch.txt
          gh workflow run sbob-publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.5.27 >> diag/dispatch.txt 2>&1 \
            || echo "sbob-publish dispatch FAILED" >> diag/dispatch.txt
          gh workflow run sbob-choco.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag=v1.5.27 >> diag/dispatch.txt 2>&1 \
            || echo "sbob-choco dispatch FAILED" >> diag/dispatch.txt
          echo "dispatched; waiting 30s" >> diag/dispatch.txt
          sleep 30
          gh run list --repo "$GITHUB_REPOSITORY" --limit 25 >> diag/dispatch.txt 2>&1 || true

      - name: Commit the dump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diag
          git commit -m "diag: run state + v1.5.27 lane dispatch" || echo "nothing to commit"
          git push origin HEAD:probe/push-run-diagnosis
