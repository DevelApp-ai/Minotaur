name: secret-visibility-probe

# Diagnostic probe for issues #168/#170 — v3: full matrix re-run after the
# v2 EMPTY verdict on the exact name (post-creation). Rules out a name
# mismatch on the newly created secret and any creation-vs-run race.
#
# Reports VISIBILITY BOOLEANS ONLY. Secret values are never printed.

on:
  push:
    branches: [ probe/secret-visibility ]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe secret visibility (booleans only)
        shell: bash
        env:
          EXACT: ${{ secrets.SBOB_PRIVATE_REGISTRY_TOKEN }}
          TYPO_REGISTY: ${{ secrets.SBOB_PRIVATE_REGISTY_TOKEN }}
          TYPO_REGISTERY: ${{ secrets.SBOB_PRIVATE_REGISTERY_TOKEN }}
          TYPO_REGISTORY: ${{ secrets.SBOB_PRIVATE_REGISTORY_TOKEN }}
          NO_UNDERSCORE: ${{ secrets.SBOB_PRIVATE_REGISTRYTOKEN }}
          PRIVAT: ${{ secrets.SBOB_PRIVAT_REGISTRY_TOKEN }}
          PLURAL: ${{ secrets.SBOB_PRIVATE_REGISTRY_TOKENS }}
          REORDERED: ${{ secrets.PRIVATE_SBOB_REGISTRY_TOKEN }}
          SBOP: ${{ secrets.SBOP_PRIVATE_REGISTRY_TOKEN }}
          PUBLIC: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          PACKAGES: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "## Secret-visibility probe (v3 — full matrix, post-creation)"
            echo
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- event: ${{ github.event_name }} | actor: ${{ github.actor }} | ref: ${{ github.ref }}"
            echo "- booleans only — secret values are never printed"
            echo
            echo "| name probed | verdict |"
            echo "| --- | --- |"
            for k in EXACT TYPO_REGISTY TYPO_REGISTERY TYPO_REGISTORY NO_UNDERSCORE PRIVAT PLURAL REORDERED SBOP PUBLIC PACKAGES; do
              v="${!k}"
              if [ -n "$v" ]; then s="VISIBLE"; else s="EMPTY"; fi
              echo "| $k | $s |"
            done
          } > /tmp/probe.md
          cat /tmp/probe.md

      - name: Report as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "probe: secret visibility v3 ($(echo "$GITHUB_SHA" | cut -c1-8))" \
            --body-file /tmp/probe.md
