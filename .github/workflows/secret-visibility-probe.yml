name: secret-visibility-probe

# Diagnostic probe v4 — SBOB_REGISTRY_TOKEN capability matrix for issue #179.
# The v1.5.39 publish run (41919935581) passed the token gate, drift gate,
# cosign signing, the public content gate and sbobctl validate/diff in BOTH
# lanes, then failed at the final step "Open the registry PR". This probe
# replays that step's exact capability chain against DevelApp-ai/SBOB-Registry
# on a SCRATCH branch (probe/token-capability), closing any PR it manages to
# open and deleting the branch in an always() cleanup step.
#
# Reports booleans, the token class, and API error lines ONLY.
# Secret values are never printed.

on:
  push:
    branches: [ probe/secret-visibility ]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe registry-token capability chain (no secret values)
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          REG: DevelApp-ai/SBOB-Registry
          BRANCH: probe/token-capability
        run: |
          set -uo pipefail
          report=/tmp/probe.md
          : > "$report"
          say() { printf '%s\n' "$1" | tee -a "$report"; }

          if [ -z "$REGISTRY_TOKEN" ]; then
            say "- token visible: FALSE (nothing further probed)"
            exit 0
          fi
          say "- token visible: TRUE"
          export GH_TOKEN="$REGISTRY_TOKEN"

          # 1. does the token authenticate at all?
          if gh api user >/dev/null 2>/tmp/err1; then
            say "- gh api user: OK (authenticates)"
          else
            say "- gh api user: FAILED — $(head -1 /tmp/err1)"
          fi

          # 2. token class: classic PATs expose X-OAuth-Scopes, fine-grained do not
          base=""
          if gh api -i "repos/$REG" >/tmp/hdrs 2>/dev/null; then
            scopes="$(grep -i '^x-oauth-scopes:' /tmp/hdrs | tr -d '\r' | cut -d' ' -f2-)"
            if [ -n "$scopes" ]; then
              say "- token class: CLASSIC — scopes: ${scopes:-<none>}"
            else
              say "- token class: FINE-GRAINED (or app token — no X-OAuth-Scopes header)"
            fi
            base="$(gh api "repos/$REG" --jq .default_branch)"
            say "- repo read: OK (default branch: $base)"
          else
            say "- repo read: FAILED — cannot resolve the registry repo"
          fi

          sha="$(gh api "repos/$REG/git/ref/heads/$base" --jq .object.sha 2>/dev/null || true)"

          # 3. create the scratch ref (requires contents:write)
          if gh api -X POST "repos/$REG/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$sha" >/dev/null 2>/tmp/err3; then
            say "- git ref create: OK"
          else
            say "- git ref create: FAILED — $(head -1 /tmp/err3)"
          fi

          # 4. contents PUT on the scratch branch (requires contents:write)
          printf 'probe: scratch file for the token-capability probe; auto-deleted\n' > /tmp/probe-file.txt
          b64="$(base64 -w0 /tmp/probe-file.txt)"
          if gh api -X PUT "repos/$REG/contents/probe/README.md" -f message="probe: token capability" -f content="$b64" -f branch="$BRANCH" >/dev/null 2>/tmp/err4; then
            say "- contents put: OK"
          else
            say "- contents put: FAILED — $(head -1 /tmp/err4)"
          fi

          # 5. pr create (fine-grained PATs ALSO need pull-requests:write here)
          prurl=""
          if prurl="$(gh pr create --repo "$REG" --base "$base" --head "$BRANCH" --title "probe: token capability (auto-cleaned)" --body "Diagnostic probe run for issue #179; closed and deleted immediately in the cleanup step." 2>/tmp/err5)"; then
            say "- pr create: OK"
          else
            say "- pr create: FAILED — $(head -1 /tmp/err5)"
          fi

          # 6. pr close (requires pull-requests:write)
          if [ -n "$prurl" ]; then
            if gh pr close "$prurl" >/dev/null 2>/tmp/err6; then
              say "- pr close: OK"
            else
              say "- pr close: FAILED — $(head -1 /tmp/err6)"
            fi
          fi

      - name: Cleanup the scratch branch (always)
        if: always()
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          REG: DevelApp-ai/SBOB-Registry
          BRANCH: probe/token-capability
        run: |
          set -uo pipefail
          export GH_TOKEN="$REGISTRY_TOKEN"
          if gh api -X DELETE "repos/$REG/git/refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "scratch ref deleted"
          else
            echo "scratch ref delete skipped or failed (ok if it was never created)"
          fi

      - name: Report as an issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## Registry-token capability probe (v4 — issue #179)"
            echo
            cat /tmp/probe.md
            echo
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- the scratch branch in DevelApp-ai/SBOB-Registry is deleted by the cleanup step; any probe PR it opened is closed."
          } > /tmp/report.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "probe: registry-token capability v4 ($(echo "$GITHUB_SHA" | cut -c1-8))" \
            --body-file /tmp/report.md
