name: secret-visibility-probe

# Diagnostic probe v7 — re-check after Lars added pull-requests:write to
# the SBOB_REGISTRY_TOKEN PAT. Same capability matrix as v5/v6 (booleans +
# API error lines only, never secret values). The v6 stray-branch sweep
# already ran; the four old branches are gone, so the sweep step now
# simply verifies the registry still carries main only.

on:
  push:
    branches: [ probe/secret-visibility ]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: "1: authenticate + token class + repo read"
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          REG: DevelApp-ai/SBOB-Registry
        run: |
          set -uo pipefail
          report=/tmp/probe.md
          touch "$report"
          say() { printf '%s\n' "$1" | tee -a "$report"; }
          [ -n "$REGISTRY_TOKEN" ] && say "- token visible: TRUE" || { say "- token visible: FALSE (nothing further probed)"; exit 0; }
          export GH_TOKEN="$REGISTRY_TOKEN"

          if gh api user >/dev/null 2>/tmp/err1; then
            say "- gh api user: OK (authenticates)"
          else
            say "- gh api user: FAILED — $(head -1 /tmp/err1)"
            exit 0
          fi

          if gh api -i "repos/$REG" >/tmp/hdrs 2>/dev/null; then
            scopes="$(grep -i '^x-oauth-scopes:' /tmp/hdrs | tr -d '\r' | cut -d' ' -f2- || true)"
            if [ -n "$scopes" ]; then
              say "- token class: CLASSIC — scopes: $scopes"
            else
              say "- token class: FINE-GRAINED or app token (no X-OAuth-Scopes header)"
            fi
            base="$(gh api "repos/$REG" --jq .default_branch || true)"
            say "- repo read: OK (default branch: $base)"
            echo "$base" > /tmp/base.txt
          else
            say "- repo read: FAILED — the token cannot see the registry repo"
          fi

      - name: "2: git ref create (needs contents:write)"
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          REG: DevelApp-ai/SBOB-Registry
          BRANCH: probe/token-capability
        run: |
          set -uo pipefail
          report=/tmp/probe.md
          say() { printf '%s\n' "$1" | tee -a "$report"; }
          export GH_TOKEN="$REGISTRY_TOKEN"
          [ -f /tmp/base.txt ] || { say "- ref create: SKIPPED (no repo read)"; exit 0; }
          base="$(cat /tmp/base.txt)"
          sha="$(gh api "repos/$REG/git/ref/heads/$base" --jq .object.sha 2>/dev/null || true)"
          if gh api -X POST "repos/$REG/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$sha" >/dev/null 2>/tmp/err3; then
            say "- git ref create: OK"
          else
            say "- git ref create: FAILED — $(head -1 /tmp/err3)"
          fi

      - name: "3: contents put (needs contents:write)"
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          REG: DevelApp-ai/SBOB-Registry
          BRANCH: probe/token-capability
        run: |
          set -uo pipefail
          report=/tmp/probe.md
          say() { printf '%s\n' "$1" | tee -a "$report"; }
          export GH_TOKEN="$REGISTRY_TOKEN"
          printf 'probe: scratch file for the token-capability probe; auto-deleted\n' > /tmp/probe-file.txt
          b64="$(base64 -w0 /tmp/probe-file.txt)"
          if gh api -X PUT "repos/$REG/contents/probe/README.md" -f message="probe: token capability" -f content="$b64" -f branch="$BRANCH" >/dev/null 2>/tmp/err4; then
            say "- contents put: OK"
          else
            say "- contents put: FAILED — $(head -1 /tmp/err4)"
          fi

      - name: "4: pr create + close (needs pull-requests:write)"
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          REG: DevelApp-ai/SBOB-Registry
          BRANCH: probe/token-capability
        run: |
          set -uo pipefail
          report=/tmp/probe.md
          say() { printf '%s\n' "$1" | tee -a "$report"; }
          export GH_TOKEN="$REGISTRY_TOKEN"
          [ -f /tmp/base.txt ] || { say "- pr create: SKIPPED (no repo read)"; exit 0; }
          base="$(cat /tmp/base.txt)"
          prurl=""
          if prurl="$(gh pr create --repo "$REG" --base "$base" --head "$BRANCH" --title "probe: token capability (auto-cleaned)" --body "Diagnostic probe run; closed and its branch deleted in the cleanup step." 2>/tmp/err5)"; then
            say "- pr create: OK — the PAT now carries pull-requests:write; the publish lane is fully self-sufficient"
          else
            say "- pr create: FAILED — $(head -1 /tmp/err5)"
            exit 0
          fi
          if gh pr close "$prurl" >/dev/null 2>/tmp/err6; then
            say "- pr close: OK"
          else
            say "- pr close: FAILED — $(head -1 /tmp/err6)"
          fi

      - name: "5: registry branch census (verify main-only hygiene)"
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          REG: DevelApp-ai/SBOB-Registry
        run: |
          set -uo pipefail
          report=/tmp/probe.md
          say() { printf '%s\n' "$1" | tee -a "$report"; }
          export GH_TOKEN="$REGISTRY_TOKEN"
          {
            say ""
            say "### Registry branch census"
            branches="$(gh api "repos/$REG/branches?per_page=100" --jq '.[].name' || true)"
            say "- branches present: $(echo "$branches" | tr '\n' ' ')"
            if [ "$(echo "$branches" | grep -c .)" -le 1 ]; then
              say "- registry carries main only — hygiene holds"
            fi
          }

      - name: "6: cleanup the scratch branch (always)"
        if: always()
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          REG: DevelApp-ai/SBOB-Registry
          BRANCH: probe/token-capability
        run: |
          set -uo pipefail
          export GH_TOKEN="$REGISTRY_TOKEN"
          if gh api -X DELETE "repos/$REG/git/refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "scratch ref deleted"
          else
            echo "scratch ref delete skipped or failed (ok if it was never created)"
          fi

      - name: "7: report as an issue (always)"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          {
            echo "## Registry-token capability probe (v7 — post-PAT-fix re-check)"
            echo
            cat /tmp/probe.md 2>/dev/null || echo "(probe produced no output)"
            echo
            echo "### Step conclusions"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[].steps[] | select(.conclusion != null) | "- step \(.number): \(.name) -> \(.conclusion)"' || true
            echo
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- the scratch branch in DevelApp-ai/SBOB-Registry is deleted by the cleanup step; any probe PR it opened is closed."
          } > /tmp/report.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "probe: registry-token capability v7 ($(echo "$GITHUB_SHA" | cut -c1-8))" \
            --body-file /tmp/report.md
