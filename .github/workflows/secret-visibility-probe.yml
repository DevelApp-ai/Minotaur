name: secret-visibility-probe

# Diagnostic probe for issues #168/#170 (sbob-publish: the forwarded
# SBOB_REGISTRY_TOKEN resolves EMPTY — org-secret visibility to this repo).
#
# Reports VISIBILITY BOOLEANS ONLY. Secret values are never printed, logged,
# echoed, or written anywhere — a name is VISIBLE (non-empty) or EMPTY.
#
# Why a matrix of names: GitHub resolves an unknown secret name to an empty
# string SILENTLY, so the only way to distinguish "wrong name" from "wrong
# container/org" from "not visible to this repo" from inside a run is to
# probe candidate names and compare. PACKAGES_READ_TOKEN (org secret #8,
# org-wide) is the baseline: if even that is EMPTY, no org secret reaches
# this repo at all.
#
# Runs on a probe-branch push (established probe/* pattern) — no main push,
# no release cut. Opens an issue with the matrix so the result is readable
# without Actions log access; close the issue when done.

on:
  push:
    branches: [ probe/secret-visibility ]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe secret visibility (booleans only)
        shell: bash
        env:
          EXACT: ${{ secrets.SBOB_PRIVATE_REGISTRY_TOKEN }}
          TYPO_REGISTY: ${{ secrets.SBOB_PRIVATE_REGISTY_TOKEN }}
          TYPO_REGISTERY: ${{ secrets.SBOB_PRIVATE_REGISTERY_TOKEN }}
          TYPO_REGISTORY: ${{ secrets.SBOB_PRIVATE_REGISTORY_TOKEN }}
          NO_UNDERSCORE: ${{ secrets.SBOB_PRIVATE_REGISTRYTOKEN }}
          PRIVAT: ${{ secrets.SBOB_PRIVAT_REGISTRY_TOKEN }}
          PLURAL: ${{ secrets.SBOB_PRIVATE_REGISTRY_TOKENS }}
          REORDERED: ${{ secrets.PRIVATE_SBOB_REGISTRY_TOKEN }}
          PUBLIC: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          PACKAGES: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "## Secret-visibility probe"
            echo
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- event: ${{ github.event_name }} | actor: ${{ github.actor }} | ref: ${{ github.ref }}"
            echo "- booleans only — secret values are never printed"
            echo
            echo "| name probed | verdict |"
            echo "| --- | --- |"
            for k in EXACT TYPO_REGISTY TYPO_REGISTERY TYPO_REGISTORY NO_UNDERSCORE PRIVAT PLURAL REORDERED PUBLIC PACKAGES; do
              v="${!k}"
              if [ -n "$v" ]; then s="VISIBLE"; else s="EMPTY"; fi
              echo "| $k | $s |"
            done
          } > /tmp/probe.md
          cat /tmp/probe.md

      - name: Report as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "probe: secret visibility ($(echo "$GITHUB_SHA" | cut -c1-8))" \
            --body-file /tmp/probe.md
