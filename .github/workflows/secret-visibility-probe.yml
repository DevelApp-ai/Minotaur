name: secret-visibility-probe

# Diagnostic probe v8 — reproduce the v1.5.41 publish failure at the exact
# `gh pr create` invocation and pin the fix. The PAT itself is proven
# capable (probe v7: pr create OK, no git context). The remaining
# difference: the publish job runs INSIDE a Minotaur checkout, and gh may
# resolve a plain --head against the local repo, which the
# SBOB-Registry-scoped fine-grained PAT cannot read.
#
# Three styles tested against a scratch branch in DevelApp-ai/SBOB-Registry:
#   A) publish-style: checkout + plain --head            (expected: FAIL)
#   B) checkout + owner-qualified --head DevelApp-ai:<br> (candidate fix)
#   C) checkout + REST POST pulls with plain head        (candidate fix)
# Booleans + API error lines only; never secret values. Auto-cleanup.

on:
  push:
    branches: [ probe/secret-visibility ]

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: "0: checkout Minotaur (git context, like the publish job)"
        uses: actions/checkout@v5

      - name: "1: create the scratch branch + file (contents:write, proven)"
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          REG: DevelApp-ai/SBOB-Registry
          BRANCH: probe/token-capability
        run: |
          set -uo pipefail
          report=/tmp/probe.md
          touch "$report"
          say() { printf '%s\n' "$1" | tee -a "$report"; }
          export GH_TOKEN="$REGISTRY_TOKEN"
          base="$(gh api "repos/$REG" --jq .default_branch)"
          echo "$base" > /tmp/base.txt
          sha="$(gh api "repos/$REG/git/ref/heads/$base" --jq .object.sha)"
          gh api -X DELETE "repos/$REG/git/refs/heads/$BRANCH" >/dev/null 2>&1 || true
          if gh api -X POST "repos/$REG/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$sha" >/dev/null 2>/tmp/err1; then
            say "- scratch ref create: OK"
          else
            say "- scratch ref create: FAILED — $(head -1 /tmp/err1)"
          fi
          printf 'probe: scratch file for the v8 invocation probe; auto-deleted\n' > /tmp/f.txt
          b64="$(base64 -w0 /tmp/f.txt)"
          if gh api -X PUT "repos/$REG/contents/probe/README.md" -f message="probe: v8 invocation test" -f content="$b64" -f branch="$BRANCH" >/dev/null 2>/tmp/err2; then
            say "- scratch contents put: OK"
          else
            say "- scratch contents put: FAILED — $(head -1 /tmp/err2)"
          fi

      - name: "2: style A — publish-style pr create (plain --head, with git context)"
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          REG: DevelApp-ai/SBOB-Registry
          BRANCH: probe/token-capability
        run: |
          set -uo pipefail
          report=/tmp/probe.md
          say() { printf '%s\n' "$1" | tee -a "$report"; }
          export GH_TOKEN="$REGISTRY_TOKEN"
          base="$(cat /tmp/base.txt)"
          if prurl="$(gh pr create --repo "$REG" --base "$base" --head "$BRANCH" --title "probe: v8 invocation test (auto-cleaned)" --body "Diagnostic probe; closed and deleted in the cleanup step." 2>/tmp/errA)"; then
            say "- style A (plain --head, git context): OK — $prurl"
            echo "$prurl" >> /tmp/prurls.txt
          else
            say "- style A (plain --head, git context): FAILED — $(head -1 /tmp/errA)"
          fi

      - name: "3: style B — owner-qualified --head DevelApp-ai:<branch>"
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          REG: DevelApp-ai/SBOB-Registry
          BRANCH: probe/token-capability
        run: |
          set -uo pipefail
          report=/tmp/probe.md
          say() { printf '%s\n' "$1" | tee -a "$report"; }
          export GH_TOKEN="$REGISTRY_TOKEN"
          base="$(cat /tmp/base.txt)"
          if prurl="$(gh pr create --repo "$REG" --base "$base" --head "DevelApp-ai:$BRANCH" --title "probe: v8 invocation test (auto-cleaned)" --body "Diagnostic probe; closed and deleted in the cleanup step." 2>/tmp/errB)"; then
            say "- style B (owner-qualified --head): OK — $prurl"
            echo "$prurl" >> /tmp/prurls.txt
          else
            say "- style B (owner-qualified --head): FAILED — $(head -1 /tmp/errB)"
          fi

      - name: "4: style C — REST POST pulls (plain head, no gh pr wrapper)"
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          REG: DevelApp-ai/SBOB-Registry
          BRANCH: probe/token-capability
        run: |
          set -uo pipefail
          report=/tmp/probe.md
          say() { printf '%s\n' "$1" | tee -a "$report"; }
          export GH_TOKEN="$REGISTRY_TOKEN"
          base="$(cat /tmp/base.txt)"
          if gh api -X POST "repos/$REG/pulls" \
               -f title="probe: v8 invocation test (auto-cleaned)" \
               -f head="$BRANCH" -f base="$base" \
               -f body="Diagnostic probe; closed and deleted in the cleanup step." \
               --jq .html_url >/tmp/prC 2>/tmp/errC; then
            say "- style C (REST POST pulls): OK — $(cat /tmp/prC)"
            cat /tmp/prC >> /tmp/prurls.txt
          else
            msg="$(head -1 /tmp/errC)"
            case "$msg" in
              *"already exists"*) say "- style C (REST POST pulls): MUTATION AUTHORIZED — refused only because a probe PR already exists from an earlier style" ;;
              *) say "- style C (REST POST pulls): FAILED — $msg" ;;
            esac
          fi

      - name: "5: cleanup (always) — close probe PRs, delete scratch branch"
        if: always()
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
          REG: DevelApp-ai/SBOB-Registry
          BRANCH: probe/token-capability
        run: |
          set -uo pipefail
          export GH_TOKEN="$REGISTRY_TOKEN"
          if [ -f /tmp/prurls.txt ]; then
            while read -r u; do
              [ -n "$u" ] || continue
              gh pr close "$u" >/dev/null 2>&1 && echo "closed $u" || echo "close skipped: $u"
            done < /tmp/prurls.txt
          fi
          gh api -X DELETE "repos/$REG/git/refs/heads/$BRANCH" >/dev/null 2>&1 && echo "scratch ref deleted" || echo "scratch ref delete skipped (ok if never created)"

      - name: "6: report as an issue (always)"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          {
            echo "## Registry PR-invocation probe (v8 — reproduce + fix the v1.5.41 publish failure)"
            echo
            cat /tmp/probe.md 2>/dev/null || echo "(probe produced no output)"
            echo
            echo "### Step conclusions"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
              --jq '.jobs[].steps[] | select(.conclusion != null) | "- step \(.number): \(.name) -> \(.conclusion)"' || true
            echo
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/report.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "probe: registry PR invocation v8 ($(echo "$GITHUB_SHA" | cut -c1-8))" \
            --body-file /tmp/report.md
