name: sbob-publish

# M6 dogfood lane (SBOB-Forge TDS 10.2/10.3/10.5): on every published stable
# release, run the SBOB-Forge registry publish pipeline for each committed
# profile — the nuget-bound linux profile (sbobforge.json) and the choco-bound
# windows profile (sbobforge-choco.json, the choco lane):
#   drift gate (generate --check --frozen --config <profile config> + purl
#     binding check)
#     -> cosign keyless signing (SBoB + provenance, org decision #14)
#     -> dialect conversion + sbobctl validate/diff
#     -> content gate (sbobforge gate, TDS 10.5; skipped on the private
#        lane by design)
#     -> registry PR in the PRIVATE registry DevelApp-ai/DevelApp-Repo-Global
#        (org decision #40 — Minotaur is an internal, GH-Packages-only product;
#         both lanes publish with lane: private;
#         nuget lane: sbobs/nuget/develapp-minotaur.linux.yaml;
#         choco lane: sbobs/choco/develapp-minotaur.windows.yaml)
#
# The pipeline REFUSES to publish a drifted profile or one not bound to the
# released version (org decision #26: the fix is regenerating, never
# hand-editing). Release flow: bump + regenerate via sbob-regenerate.yml,
# merge that PR, then cut the release.
#
# Prereleases are skipped: beta profiles are not registry material.
#
# Chaining: a release published BY CI with GITHUB_TOKEN does not fire the
# `release` event (GitHub's workflow-recursion guard), so ci-cd-enhanced's
# release job dispatches this workflow via workflow_dispatch with the tag
# input — the one event GITHUB_TOKEN CAN trigger (GitHub changelog
# 2022-09-08). The `release` trigger stays for releases published outside
# CI; both paths run the same jobs.
# Requires the SBOB_PRIVATE_REGISTRY_TOKEN org secret (contents:write on
# DevelApp-ai/DevelApp-Repo-Global, org decision #40) to open the cross-repo
# registry PR; the sbobctl validate/diff tooling is checked out from the pinned
# Software-Bill-of-Behavior ref inside the reusable workflow.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (v-prefixed) to publish SBoBs for (chained from ci-cd-enhanced on stable cuts)'
        required: true
        type: string

jobs:
  # Runs for both the release event and the chained dispatch; the prerelease
  # guard moved to the publish jobs so a dispatch against a prerelease tag
  # resolves first and then skips cleanly.
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Resolve the released version (release event or chained dispatch)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            pre="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          else
            tag="${{ github.event.release.tag_name }}"
            pre="${{ github.event.release.prerelease }}"
          fi
          v="${tag#v}"
          case "$v" in
            ''|*[!0-9A-Za-z.+-]*) echo "unexpected tag '$tag'"; exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  sbob-publish:
    needs: [resolve-version]
    if: ${{ needs.resolve-version.outputs.prerelease != 'true' }}
    uses: DevelApp-ai/SBOB-Forge/.github/workflows/sbob-registry-publish.yml@b74466e07ee2ea7caf9945095a4c4402bee910e8
    with:
      package-purl: pkg:nuget/develapp.minotaur@${{ needs.resolve-version.outputs.version }}
      sbob-file: sbob/develapp-minotaur.linux.sbob.yaml
      provenance-file: sbob/develapp-minotaur.linux.provenance.jsonl
      registry-dir: sbobs/nuget
      registry-name: develapp-minotaur.linux
      # Private/internal lane (org decision #40): PR target + token.
      registry-repo: DevelApp-ai/DevelApp-Repo-Global
      lane: private
      sbob-forge-ref: 5a5c9984b070dc88decc8a7454920be31ce2ac5f
    permissions:
      contents: read
      id-token: write   # cosign keyless OIDC (org decision #14)
    secrets:
      SBOB_REGISTRY_TOKEN: ${{ secrets.SBOB_PRIVATE_REGISTRY_TOKEN }}

  sbob-publish-choco:
    needs: [resolve-version]
    if: ${{ needs.resolve-version.outputs.prerelease != 'true' }}
    uses: DevelApp-ai/SBOB-Forge/.github/workflows/sbob-registry-publish.yml@b74466e07ee2ea7caf9945095a4c4402bee910e8
    with:
      package-purl: pkg:choco/develapp.minotaur@${{ needs.resolve-version.outputs.version }}
      sbob-file: sbob/develapp-minotaur.windows.sbob.yaml
      provenance-file: sbob/develapp-minotaur.windows.provenance.jsonl
      registry-dir: sbobs/choco
      registry-name: develapp-minotaur.windows
      sbob-config: sbobforge-choco.json
      # Private/internal lane (org decision #40): PR target + token.
      registry-repo: DevelApp-ai/DevelApp-Repo-Global
      lane: private
      sbob-forge-ref: 5a5c9984b070dc88decc8a7454920be31ce2ac5f
    permissions:
      contents: read
      id-token: write   # cosign keyless OIDC (org decision #14)
    secrets:
      SBOB_REGISTRY_TOKEN: ${{ secrets.SBOB_PRIVATE_REGISTRY_TOKEN }}
