name: sbob-publish

# M6 dogfood lane (SBOB-Forge TDS 10.2/10.3/10.5): on every published stable
# release, run the SBOB-Forge registry publish pipeline for each committed
# profile — the nuget-bound linux profile (sbobforge.json) and the choco-bound
# windows profile (sbobforge-choco.json, the choco lane):
#   drift gate (generate --check --frozen --config <profile config> + purl
#     binding check)
#     -> cosign keyless signing (SBoB + provenance, org decision #14)
#     -> dialect conversion + sbobctl validate/diff
#     -> public-lane content gate (sbobforge gate, TDS 10.5)
#     -> registry PR in DevelApp-ai/Software-Bill-of-Behavior
#        (nuget lane: sbobs/nuget/develapp-minotaur.linux.yaml;
#         choco lane: sbobs/choco/develapp-minotaur.windows.yaml)
#
# The pipeline REFUSES to publish a drifted profile or one not bound to the
# released version (org decision #26: the fix is regenerating, never
# hand-editing). Release flow: bump + regenerate via sbob-regenerate.yml,
# merge that PR, then cut the release.
#
# Prereleases are skipped: beta profiles are not registry material.
# Requires the SBOB_REGISTRY_TOKEN org secret (contents:write on the
# Software-Bill-of-Behavior repo) to open the cross-repo registry PR.

on:
  release:
    types: [published]

jobs:
  resolve-version:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip the v prefix from the release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          v="${{ github.event.release.tag_name }}"
          v="${v#v}"
          case "$v" in
            ''|*[!0-9A-Za-z.+-]*) echo "unexpected tag '${{ github.event.release.tag_name }}'"; exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

  sbob-publish:
    needs: [resolve-version]
    uses: DevelApp-ai/SBOB-Forge/.github/workflows/sbob-registry-publish.yml@177f6f337898d6bf6100a3f24b961fbc1f811aa6
    with:
      package-purl: pkg:nuget/develapp.minotaur@${{ needs.resolve-version.outputs.version }}
      sbob-file: sbob/develapp-minotaur.linux.sbob.yaml
      provenance-file: sbob/develapp-minotaur.linux.provenance.jsonl
      registry-dir: sbobs/nuget
      registry-name: develapp-minotaur.linux
    permissions:
      contents: read
      id-token: write   # cosign keyless OIDC (org decision #14)
    secrets:
      SBOB_REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}

  sbob-publish-choco:
    needs: [resolve-version]
    uses: DevelApp-ai/SBOB-Forge/.github/workflows/sbob-registry-publish.yml@177f6f337898d6bf6100a3f24b961fbc1f811aa6
    with:
      package-purl: pkg:choco/develapp.minotaur@${{ needs.resolve-version.outputs.version }}
      sbob-file: sbob/develapp-minotaur.windows.sbob.yaml
      provenance-file: sbob/develapp-minotaur.windows.provenance.jsonl
      registry-dir: sbobs/choco
      registry-name: develapp-minotaur.windows
      sbob-config: sbobforge-choco.json
    permissions:
      contents: read
      id-token: write   # cosign keyless OIDC (org decision #14)
    secrets:
      SBOB_REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
