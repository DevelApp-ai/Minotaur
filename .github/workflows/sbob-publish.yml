name: sbob-publish

# M6 dogfood lane (SBOB-Forge TDS 10.2/10.3/10.5): on every published stable
# release, run the SBOB-Forge registry publish pipeline for each committed
# profile — the nuget-bound linux profile (sbobforge.json) and the choco-bound
# windows profile (sbobforge-choco.json, the choco lane):
#   drift gate (generate --check --frozen --config <profile config> + purl
#     binding check)
#     -> cosign keyless signing (SBoB + provenance, org decision #14)
#     -> dialect conversion + sbobctl validate/diff
#     -> content gate (sbobforge gate, TDS 10.5; ENFORCED — public lane)
#     -> registry PR in the PUBLIC registry DevelApp-ai/SBOB-Registry
#        (org decision #40 — routing amended 2026-11-04: Minotaur is a
#         PUBLIC product (anonymous fetch verified), so both lanes publish
#         with lane: public and the content gate enforced;
#         the original private-lane wiring was premised on Minotaur being a
#         private repo, which is factually wrong. Both profiles are
#         public-lane clean (the linux profile: 3 /tmp opens, no exec, no
#         network; the windows profile is gated in the sbob-choco drift
#         step on every run).
#         nuget lane: sbobs/nuget/develapp-minotaur.linux.yaml;
#         choco lane: sbobs/choco/develapp-minotaur.windows.yaml)
#
# The pipeline REFUSES to publish a drifted profile or one not bound to the
# released version (org decision #26: the fix is regenerating, never
# hand-editing). Release flow: bump + regenerate via sbob-regenerate.yml,
# merge that PR, then cut the release.
#
# Prereleases are skipped: beta profiles are not registry material.
#
# Chaining: a release published BY CI with GITHUB_TOKEN does not fire the
# `release` event (GitHub's workflow-recursion guard), so ci-cd-enhanced's
# release job dispatches this workflow via workflow_dispatch with the tag
# input — the one event GITHUB_TOKEN CAN trigger (GitHub changelog
# 2022-09-08). The `release` trigger stays for releases published outside
# CI; both paths run the same jobs.
# Requires the SBOB_REGISTRY_TOKEN org secret (contents:write on
# DevelApp-ai/SBOB-Registry, org decision #40) to open the cross-repo
# registry PR; the sbobctl validate/diff tooling is checked out from the pinned
# Software-Bill-of-Behavior ref inside the reusable workflow.
#
# Observability (cf. ci-cd-enhanced.yml report-push-failure): these lanes run
# on workflow_dispatch / release events with no PR to comment on — the
# 2026-11-03 dispatch failures were only discovered because the registry
# PRs never appeared. On any failed lane, report-failure opens an issue
# naming the failed jobs and steps, with a link to the run.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (v-prefixed) to publish SBoBs for (chained from ci-cd-enhanced on stable cuts)'
        required: true
        type: string

jobs:
  # Runs for both the release event and the chained dispatch; the prerelease
  # guard moved to the publish jobs so a dispatch against a prerelease tag
  # resolves first and then skips cleanly.
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Resolve the released version (release event or chained dispatch)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
            pre="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          else
            tag="${{ github.event.release.tag_name }}"
            pre="${{ github.event.release.prerelease }}"
          fi
          v="${tag#v}"
          case "$v" in
            ''|*[!0-9A-Za-z.+-]*) echo "unexpected tag '$tag'"; exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  sbob-publish:
    needs: [resolve-version]
    if: ${{ needs.resolve-version.outputs.prerelease != 'true' }}
    uses: DevelApp-ai/SBOB-Forge/.github/workflows/sbob-registry-publish.yml@8d6dfa0775e362c50075fe2dc461eeb44a509e3c
    with:
      package-purl: pkg:nuget/develapp.minotaur@${{ needs.resolve-version.outputs.version }}
      sbob-file: sbob/develapp-minotaur.linux.sbob.yaml
      provenance-file: sbob/develapp-minotaur.linux.provenance.jsonl
      registry-dir: sbobs/nuget
      registry-name: develapp-minotaur.linux
      # Public lane (org decision #40, routing amended 2026-11-04): PR target + token.
      registry-repo: DevelApp-ai/SBOB-Registry
      lane: public
      sbob-forge-ref: 5a5c9984b070dc88decc8a7454920be31ce2ac5f
    permissions:
      contents: read
      # The reusable workflow restores the sbobforge substrate from GitHub
      # Packages with the #8 fallback (PACKAGES_READ_TOKEN || github.token);
      # without packages: read here the fallback token 403s (NU1301), which
      # is how all four dispatch runs failed on 2026-11-03.
      packages: read    # GitHub Packages restore of the sbobforge substrate (org decision #8)
      id-token: write   # cosign keyless OIDC (org decision #14)
    secrets:
      SBOB_REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
      # Forward the org secret so the reusable workflow can authenticate the
      # GitHub Packages substrate restore (org decision #8). In a reusable
      # workflow the caller's PACKAGES_READ_TOKEN is invisible unless
      # forwarded, so the restore silently fell back to github.token and
      # NU1301-403'd (every 2026-11-03 dispatch) — the callee now declares
      # this optional secret (SBOB-Forge #35).
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}

  sbob-publish-choco:
    needs: [resolve-version]
    if: ${{ needs.resolve-version.outputs.prerelease != 'true' }}
    uses: DevelApp-ai/SBOB-Forge/.github/workflows/sbob-registry-publish.yml@8d6dfa0775e362c50075fe2dc461eeb44a509e3c
    with:
      package-purl: pkg:choco/develapp.minotaur@${{ needs.resolve-version.outputs.version }}
      sbob-file: sbob/develapp-minotaur.windows.sbob.yaml
      provenance-file: sbob/develapp-minotaur.windows.provenance.jsonl
      registry-dir: sbobs/choco
      registry-name: develapp-minotaur.windows
      sbob-config: sbobforge-choco.json
      # Public lane (org decision #40, routing amended 2026-11-04): PR target + token.
      registry-repo: DevelApp-ai/SBOB-Registry
      lane: public
      sbob-forge-ref: 5a5c9984b070dc88decc8a7454920be31ce2ac5f
    permissions:
      contents: read
      # The reusable workflow restores the sbobforge substrate from GitHub
      # Packages with the #8 fallback (PACKAGES_READ_TOKEN || github.token);
      # without packages: read here the fallback token 403s (NU1301), which
      # is how all four dispatch runs failed on 2026-11-03.
      packages: read    # GitHub Packages restore of the sbobforge substrate (org decision #8)
      id-token: write   # cosign keyless OIDC (org decision #14)
    secrets:
      SBOB_REGISTRY_TOKEN: ${{ secrets.SBOB_REGISTRY_TOKEN }}
      # Forward the org secret so the reusable workflow can authenticate the
      # GitHub Packages substrate restore (org decision #8). In a reusable
      # workflow the caller's PACKAGES_READ_TOKEN is invisible unless
      # forwarded, so the restore silently fell back to github.token and
      # NU1301-403'd (every 2026-11-03 dispatch) — the callee now declares
      # this optional secret (SBOB-Forge #35).
      PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
  # Observability (cf. ci-cd-enhanced.yml report-push-failure): these lanes
  # run on workflow_dispatch / release events with no PR to comment on — the
  # 2026-11-03 dispatch failures were only discovered because the registry
  # PRs never appeared. On any failed lane, open an issue naming the failed
  # jobs and steps, with a link to the run.
  report-failure:
    runs-on: ubuntu-latest
    needs: [resolve-version, sbob-publish, sbob-publish-choco]
    if: always() && contains(needs.*.result, 'failure')
    permissions:
      issues: write
    steps:
      - name: Open a failure report issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          failed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | select(.conclusion=="failure") | .name' | sed 's/^/job: /' || echo "job list unavailable")"
          steps="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[].steps[] | select(.conclusion=="failure") | .name' | sort -u | sed 's/^/step: /' || echo "step list unavailable")"
          {
            echo "The sbob-publish run for tag **$tag** failed."
            echo
            echo "$failed"
            echo "$steps"
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > /tmp/body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "sbob-publish: publish run failed ($tag)" --body-file /tmp/body.md || echo "issue creation failed (report manually)"
