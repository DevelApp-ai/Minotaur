name: CI/CD Pipeline

# Publishing is signed with Certum cloud code signing (org decisions
# DevelApp-ai/DevelApp-Repo-Global#38 + #73, incl. the SHA-256 amendment,
# 2026-11-12): on non-PR runs the sign job (windows-latest) signs the packed
# .nupkg via 'dotnet nuget sign --certificate-fingerprint <SHA-256
# fingerprint> --timestamper http://time.certum.pl' and gates on
# 'dotnet nuget verify' BEFORE anything is published; the prerelease and
# release lanes then consume only verified packages. PR-triggered builds
# skip signing so no TOTP window is spent on PR builds (the PR package
# lane stays unsigned by design, org-wide convention).

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      create_stable_release:
        description: 'Create v1.0.0 stable release'
        required: false
        default: 'false'
        type: choice
        options:
        - 'false'
        - 'true'

permissions:
  contents: write
  packages: write
  actions: read
  checks: write
  pull-requests: write
  security-events: write
  statuses: write

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'src/Minotaur.sln'
  PROJECT_PATH: 'src/Minotaur/Minotaur.csproj'

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.final-version.outputs.version }}
      prerelease: ${{ steps.final-version.outputs.prerelease }}
      full-version: ${{ steps.final-version.outputs.full-version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
      with:
        versionSpec: '6.x'

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

    - name: Adjust version for pull requests
      id: final-version
      run: |
        VERSION="${{ steps.gitversion.outputs.SemVer }}"
        PRERELEASE="${{ steps.gitversion.outputs.PreReleaseTag }}"
        # Use SemVer (without build metadata) for package version to ensure NuGet.org compatibility
        # FullSemVer includes build metadata like +37 which causes issues on NuGet.org
        FULL_VERSION="$VERSION"
        
        # Check if this is a pull request and adjust version accordingly
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            # Pull request to main -> use beta
            if [[ "$PRERELEASE" == "PullRequest" ]]; then
              PRERELEASE="beta"
              FULL_VERSION="${VERSION}-beta.PR${{ github.event.number }}"
            fi
          else
            # Pull request to other branches -> use alpha
            if [[ "$PRERELEASE" == "PullRequest" ]]; then
              PRERELEASE="alpha"
              FULL_VERSION="${VERSION}-alpha.PR${{ github.event.number }}"
            fi
          fi
        fi
        
        # GitVersion 6.x (5.x -> 6.x migration in #147/#149) ignores the v5
        # "mode:" keys in GitVersion.yml, so main computes like Continuous-
        # Deployment: SemVer carries a commit-count pre-release ("1.5.26-6")
        # and PreReleaseTag is non-empty. That made the stable-release job's
        # "prerelease == ''" gate skip every push to main (no releases since
        # v1.5.25, 2026-11-01). Stable cuts on main use the clean MajorMinorPatch
        # (still exactly one patch increment per merge into main, as with 5.x).
        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" && "${{ steps.gitversion.outputs.PreReleaseLabel }}" == "" ]]; then
          VERSION="${{ steps.gitversion.outputs.MajorMinorPatch }}"
          PRERELEASE=""
          FULL_VERSION="$VERSION"
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
        echo "full-version=$FULL_VERSION" >> $GITHUB_OUTPUT

    - name: Display Version
      run: |
        echo "Version: ${{ steps.final-version.outputs.version }}"
        echo "PreReleaseTag: ${{ steps.final-version.outputs.prerelease }}"
        echo "FullSemVer: ${{ steps.final-version.outputs.full-version }}"

  build-and-test:
    runs-on: ubuntu-latest
    needs: calculate-version
    outputs:
      test-results: ${{ steps.test.outputs.test-results }}
      coverage-results: ${{ steps.test.outputs.coverage-results }}
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: |
        # Retry: GitHub Packages restore intermittently fails (NU1301) on Windows runners
        dotnet restore ${{ env.SOLUTION_PATH }} || (sleep 20 && dotnet restore ${{ env.SOLUTION_PATH }}) || (sleep 40 && dotnet restore ${{ env.SOLUTION_PATH }})

    - name: Build solution
      run: |
        dotnet build ${{ env.SOLUTION_PATH }} \
          --configuration Release \
          --no-restore \
          -p:Version=${{ needs.calculate-version.outputs.version }} \
          -p:PackageVersion=${{ needs.calculate-version.outputs.full-version }}

    - name: Run tests with coverage
      id: test
      run: |
        # --no-restore: the build above already restored; the implicit restore here
        # can hit the same transient GitHub Packages NU1301 issues the lint job guards against
        set +e
        dotnet test ${{ env.SOLUTION_PATH }} \
          --configuration Release \
          --no-build \
          --no-restore \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults/ \
          --logger "trx;LogFileName=test-results.trx" \
          --logger "console;verbosity=normal" 2>&1 | tee /tmp/test-output.txt
        test_exit=${PIPESTATUS[0]}
        set -e
        # Surface failed tests in the job summary (GitHub does not annotate
        # dotnet test failures, and the raw log is truncated for large runs)
        if [ "$test_exit" -ne 0 ]; then
          {
            echo "## Failed tests (from dotnet test console output)"
            echo '```'
            grep -B 2 -A 30 -E "^\s+Failed [A-Za-z].*|Test host process crashed|The active test run was aborted|Failed!|Failed:.*[1-9]" /tmp/test-output.txt | head -300
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # GitHub annotations ARE visible on the public job page (the raw log
          # and step summary are not), so surface the failed tests there too
          grep -E '^\s+Failed [A-Za-z]' /tmp/test-output.txt | head -10 | while IFS= read -r line; do
            printf '::error title=Failed test::%s\n' "$(printf '%s' "$line" | sed 's/^[[:space:]]*//' | tr -d '\r' | head -c 240)"
          done
          grep -E 'Test host process crashed|The active test run was aborted' /tmp/test-output.txt | head -3 | while IFS= read -r line; do
            printf '::error::%s\n' "$(printf '%s' "$line" | tr -d '\r' | head -c 240)"
          done
          exit "$test_exit"
        fi

    - name: Generate coverage report
      if: always()
      continue-on-error: true
      uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
      with:
        reports: './TestResults/**/coverage.cobertura.xml'
        targetdir: './CoverageReport'
        reporttypes: 'Html;JsonSummary'

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-results
        path: |
          TestResults/**/*.xml
          TestResults/**/*.trx

    - name: Upload coverage report
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: coverage-report
        path: CoverageReport/

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: [calculate-version, build-and-test]
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: |
        # Retry: GitHub Packages restore intermittently fails (NU1301) on Windows runners
        dotnet restore ${{ env.SOLUTION_PATH }} || (sleep 20 && dotnet restore ${{ env.SOLUTION_PATH }}) || (sleep 40 && dotnet restore ${{ env.SOLUTION_PATH }})
    
    - name: Build for analysis
      run: |
        dotnet build ${{ env.SOLUTION_PATH }} \
          --no-restore \
          --configuration Release \
          -p:Version=${{ needs.calculate-version.outputs.version }} \
          -p:PackageVersion=${{ needs.calculate-version.outputs.full-version }}
    
    - name: Run security analysis
      run: |
        dotnet list ${{ env.SOLUTION_PATH }} package --vulnerable --include-transitive || true
    
    - name: Check for outdated packages
      run: |
        dotnet list ${{ env.SOLUTION_PATH }} package --outdated || true

  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    needs: calculate-version
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Install dotnet format tool
      run: dotnet tool install -g dotnet-format
    
    - name: Restore dependencies
      run: |
        # Retry: GitHub Packages restore intermittently fails (NU1301) on Windows runners
        dotnet restore ${{ env.SOLUTION_PATH }} || (sleep 20 && dotnet restore ${{ env.SOLUTION_PATH }}) || (sleep 40 && dotnet restore ${{ env.SOLUTION_PATH }})
    
    - name: Check code formatting
      run: dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes --verbosity diagnostic --exclude examples/
    
    - name: Run static analysis
      run: |
        # --no-restore: use the retried restore above; an implicit restore here can hit
        # transient GitHub Packages issues whose NU warnings become errors under TreatWarningsAsErrors
        dotnet build ${{ env.SOLUTION_PATH }} \
          --no-restore \
          --configuration Release \
          --verbosity normal \
          -p:TreatWarningsAsErrors=true \
          -p:Version=${{ needs.calculate-version.outputs.version }} \
          -p:PackageVersion=${{ needs.calculate-version.outputs.full-version }}

  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [calculate-version, build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: |
        # Retry: GitHub Packages restore intermittently fails (NU1301) on Windows runners
        dotnet restore ${{ env.SOLUTION_PATH }} || (sleep 20 && dotnet restore ${{ env.SOLUTION_PATH }}) || (sleep 40 && dotnet restore ${{ env.SOLUTION_PATH }})
    
    - name: Build solution
      run: |
        dotnet build ${{ env.SOLUTION_PATH }} \
          --no-restore \
          --configuration Release \
          -p:Version=${{ needs.calculate-version.outputs.version }} \
          -p:PackageVersion=${{ needs.calculate-version.outputs.full-version }}
    
    - name: Run demo application for performance testing
      run: |
        if [ -d "src/Minotaur.Demo" ]; then
          cd src/Minotaur.Demo
          timeout 30s dotnet run --configuration Release || echo "Demo completed or timed out as expected"
        else
          echo "No demo projects found for performance testing"
        fi

  package:
    runs-on: ubuntu-latest
    needs: [calculate-version, build-and-test, code-quality, lint-and-format]
    outputs:
      package-path: ${{ steps.package.outputs.package-path }}
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: |
        # Retry: GitHub Packages restore intermittently fails (NU1301) on Windows runners
        dotnet restore ${{ env.SOLUTION_PATH }} || (sleep 20 && dotnet restore ${{ env.SOLUTION_PATH }}) || (sleep 40 && dotnet restore ${{ env.SOLUTION_PATH }})

    - name: Build for packaging
      run: |
        dotnet build ${{ env.SOLUTION_PATH }} \
          --configuration Release \
          --no-restore \
          -p:Version=${{ needs.calculate-version.outputs.version }} \
          -p:PackageVersion=${{ needs.calculate-version.outputs.full-version }}

    - name: Create NuGet package
      id: package
      run: |
        dotnet pack ${{ env.PROJECT_PATH }} \
          --configuration Release \
          --no-build \
          --output ./packages \
          -p:PackageVersion=${{ needs.calculate-version.outputs.full-version }}
        echo "package-path=./packages" >> $GITHUB_OUTPUT

    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v6
      with:
        name: nuget-packages
        path: ./packages/*.nupkg

  sign:
    name: Sign NuGet package (Certum cloud)
    runs-on: windows-latest
    needs: [calculate-version, package]
    # Non-PR runs only (org decisions #38 + #73): branch pushes (main stable,
    # develop/feature prereleases), release events and manual dispatches are
    # signed; PR-triggered builds skip signing so no TOTP window is spent on
    # PR builds (the PR package lane stays unsigned by design).
    if: github.event_name != 'pull_request'
    steps:
    - name: Download packages
      uses: actions/download-artifact@v6
      with:
        name: nuget-packages
        path: packages/

    - name: Validate signing inputs
      # Fail fast BEFORE the SimplySign login consumes a TOTP window
      # (values are never echoed).
      shell: pwsh
      env:
        CERTUM_SIMPLYSIGN_USERID: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        CERTUM_SIMPLYSIGN_OTP_URI: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        CERTUM_THUMBPRINT: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        CERTUM_FINGERPRINT_SHA256: ${{ secrets.CODE_SIGNING_CERT_FINGERPRINT_SHA256 }}
      run: |
        foreach ($name in @('CERTUM_SIMPLYSIGN_USERID','CERTUM_SIMPLYSIGN_OTP_URI','CERTUM_THUMBPRINT','CERTUM_FINGERPRINT_SHA256')) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            throw "Missing signing input: $name (org secrets setup, decision #38)"
          }
        }
        $tp = $env:CERTUM_THUMBPRINT -replace '\s',''
        if ($tp -notmatch '^[0-9A-Fa-f]{40}$') { throw 'Certificate thumbprint must be exactly 40 hex characters (CODE_SIGNING_CERT_THUMBPRINT org secret).' }
        $fp = $env:CERTUM_FINGERPRINT_SHA256 -replace '\s',''
        if ($fp -notmatch '^[0-9A-Fa-f]{64}$') { throw 'Certificate fingerprint must be exactly 64 hex characters (CODE_SIGNING_CERT_FINGERPRINT_SHA256 org secret, decision #73 amendment).' }
        $uri = $null
        if (-not [Uri]::TryCreate($env:CERTUM_SIMPLYSIGN_OTP_URI, [UriKind]::Absolute, [ref]$uri) -or
            $uri.Scheme -ne 'otpauth' -or $uri.Host -ne 'totp' -or
            $uri.Query -notmatch '[?&]secret=[A-Za-z2-7]+=*(&|$)') {
          throw 'CERTUM_SIMPLYSIGN_OTP_URI must be the full otpauth://totp provisioning URI (org secrets setup, decision #38).'
        }

    - name: Connect to Certum SimplySign
      # Pinned by full commit SHA; proven by the LocalTaskhandler signing
      # test (run 43089090840, 2026-11-11). Never sees
      # CERTUM_SIMPLYSIGN_PASSWORD - that secret stays dormant.
      uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
      with:
        certum-username: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        certum-otp-uri: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        certum-key-id: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        capture-diagnostics: 'false'

    - name: Sign NuGet package
      # SHA-256 fingerprint interface (decision #73 amendment, 2026-11-12):
      # works identically on .NET 9 and .NET 10 SDKs; no SDK pin needed.
      shell: pwsh
      env:
        CERTUM_FINGERPRINT_SHA256: ${{ secrets.CODE_SIGNING_CERT_FINGERPRINT_SHA256 }}
      run: |
        $fp = ($env:CERTUM_FINGERPRINT_SHA256 -replace '\s','').ToUpperInvariant()
        $packages = @(Get-ChildItem packages/*.nupkg)
        if (-not $packages.Count) { throw 'No packages found to sign.' }
        foreach ($p in $packages) {
          dotnet nuget sign $p.FullName --certificate-fingerprint $fp --timestamper http://time.certum.pl
          if ($LASTEXITCODE -ne 0) { throw "Signing failed (exit $LASTEXITCODE): $($p.Name)" }
        }

    - name: Verify signatures (gate)
      # Any invalid signature fails the job and blocks the publishing lanes.
      shell: pwsh
      run: |
        foreach ($p in @(Get-ChildItem packages/*.nupkg)) {
          dotnet nuget verify $p.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed (exit $LASTEXITCODE): $($p.Name)" }
        }

    - name: Upload signed packages
      uses: actions/upload-artifact@v6
      with:
        name: nuget-packages-signed
        path: packages/*.nupkg
        if-no-files-found: error

  publish-pr-package:
    runs-on: ubuntu-latest
    needs: [calculate-version, build-and-test, package]
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download packages
      uses: actions/download-artifact@v7
      with:
        name: nuget-packages
        path: ./packages

    - name: Publish to GitHub Packages
      run: |
        dotnet nuget push ./packages/*.nupkg \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
          --skip-duplicate
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prerelease:
    runs-on: ubuntu-latest
    needs: [calculate-version, build-and-test, package, sign]
    # Sign gate (org decisions #38 + #73): only verified packages reach the
    # prerelease lane (branch pushes always sign; see the sign job).
    if: |
      needs.sign.result == 'success' &&
      github.event_name == 'push' && 
      (contains(github.ref, 'refs/heads/develop') || 
       contains(github.ref, 'refs/heads/copilot/') ||
       contains(github.ref, 'refs/heads/feature/'))
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download signed packages
      uses: actions/download-artifact@v7
      with:
        name: nuget-packages-signed
        path: ./packages

    - name: Create Pre-release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ needs.calculate-version.outputs.full-version }}
        name: Minotaur v${{ needs.calculate-version.outputs.full-version }}
        body: |
          ## Minotaur Pre-release v${{ needs.calculate-version.outputs.full-version }}
          
          This is a pre-release version generated from branch: ${{ github.ref_name }}
          
          ### Changes
          - Enhanced location tracking precision APIs
          - Context modifier API exposure  
          - Rule activation callback implementation
          - Complete GrammarForge requirements implementation
          
          ### Installation
          ```bash
          dotnet add package DevelApp.Minotaur --version ${{ needs.calculate-version.outputs.full-version }}
          ```
          
          **Note**: This is a pre-release version intended for testing.
        draft: false
        prerelease: true
        files: ./packages/*.nupkg

  release:
    runs-on: ubuntu-latest
    needs: [calculate-version, build-and-test, package, sign]
    # prerelease-gate dropped: GitVersion 6.x always emits a commit-count
    # PreReleaseTag on main (see calculate-version); the ref check alone
    # scopes stable releases to pushes on main.
    # Sign gate (org decisions #38 + #73): only verified packages reach the
    # stable lane; a sign failure blocks the release.
    if: |
      needs.sign.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'release' && github.event.action == 'published') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.create_stable_release == 'true'))
    permissions:
      contents: write    # create the stable release + attach assets
      packages: write    # publish the nupkg to GitHub Packages
      actions: write     # dispatch the sbob-publish / sbob-choco chain lanes
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Download signed packages
      uses: actions/download-artifact@v7
      with:
        name: nuget-packages-signed
        path: ./packages

    - name: Create GitHub Release (for main branch pushes and manual dispatch)
      if: |
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.create_stable_release == 'true')
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.event_name == 'workflow_dispatch' && '1.0.0' || needs.calculate-version.outputs.version }}
        name: "Minotaur v${{ github.event_name == 'workflow_dispatch' && '1.0.0' || needs.calculate-version.outputs.version }} - Stable Release"
        body: |
          # Minotaur v${{ needs.calculate-version.outputs.version }} - Stable Release

          ## What's New

          This is a stable release of Minotaur, a powerful cognitive graph editing and parsing framework.

          ### Core Features
          - **StepParser Integration**: Complete parsing pipeline with step-by-step debugging capabilities
          - **Graph Editor**: Full cognitive graph editing with comprehensive undo/redo support  
          - **Plugin System**: Extensible unparsing system supporting C#, JavaScript, and Python
          - **Enhanced Location Tracking**: Precise APIs for syntax tree navigation and manipulation
          - **Context-Aware Editing**: Advanced context-aware editing capabilities for intelligent code generation

          ### Developer Experience  
          - **Comprehensive Testing**: 56+ unit tests covering all functionality with 100% pass rate
          - **CI/CD Pipeline**: Fully automated builds, testing, quality checks, and releases
          - **Rich Documentation**: Complete API documentation with examples and integration guides
          - **High Performance**: Optimized parsing algorithms and efficient graph operations

          ### Installation

          ```bash
          dotnet add package DevelApp.Minotaur --version ${{ github.event_name == 'workflow_dispatch' && '1.0.0' || needs.calculate-version.outputs.version }}
          ```

          ### Requirements
          - .NET 8.0 or later
          - Compatible with Windows, macOS, and Linux

          This release represents a stable, production-ready version of Minotaur suitable for integration into development workflows and toolchains.
        draft: false
        prerelease: false
        files: ./packages/*.nupkg

    - name: Publish to GitHub Packages
      run: |
        echo "Publishing to GitHub Packages..."
        dotnet nuget push ./packages/*.nupkg \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
          --skip-duplicate
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Publishing target is GitHub Packages ONLY (#72): DevelApp consumers (e.g. Golem)
    # authenticate to https://nuget.pkg.github.com/DevelApp-ai/index.json.
    # There is intentionally no NuGet.org publish step.

    - name: Create GitHub Release Assets
      uses: softprops/action-gh-release@v3
      with:
        # The assets step must target the same release as 'Create GitHub Release':
        # - release published -> the release's own tag
        # - workflow_dispatch stable release -> v1.0.0
        # - push to main -> the GitVersion-derived tag
        tag_name: ${{ github.event.release.tag_name || (github.event_name == 'workflow_dispatch' && '1.0.0' || format('v{0}', needs.calculate-version.outputs.version)) }}
        # Re-uploading the same nupkg to an existing release overwrites instead of 422-ing
        overwrite_files: true
        files: ./packages/*.nupkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Chain the sbob-publish + sbob-choco release lanes
      # Publishing a release with GITHUB_TOKEN does NOT fire the 'release'
      # event (GitHub's workflow-recursion guard) — sbob-publish.yml and the
      # sbob-choco.yml release lane never triggered on CI-cut releases, which
      # is how the M6 registry lanes went silently unpublished. workflow_dispatch
      # is the one event GITHUB_TOKEN CAN trigger (GitHub changelog 2022-09-08),
      # so dispatch both lanes explicitly.
      if: |
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.create_stable_release == 'true')
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        tag="v${{ github.event_name == 'workflow_dispatch' && '1.0.0' || needs.calculate-version.outputs.version }}"
        gh workflow run sbob-publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$tag"
        gh workflow run sbob-choco.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$tag"
        echo "dispatched sbob-publish + sbob-choco for $tag"

  # Manual job to create v1.0.0 release from main branch
  create-stable-release:
    runs-on: ubuntu-latest
    needs: [calculate-version, build-and-test, code-quality, lint-and-format]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_stable_release == 'true'
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Build and Package v1.0.0
      run: |
        dotnet restore ${{ env.SOLUTION_PATH }}
        dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore -p:Version=1.0.0 -p:PackageVersion=1.0.0
        dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./packages -p:PackageVersion=1.0.0

    - name: Create v1.0.0 Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v1.0.0
        name: "Minotaur v1.0.0 - First Stable Release"
        body: |
          # Minotaur v1.0.0 - First Stable Release

          ## What's New

          This is the first stable release of Minotaur, a powerful cognitive graph editing and parsing framework.

          ### Core Features
          - **StepParser Integration**: Complete parsing pipeline with step-by-step debugging capabilities
          - **Graph Editor**: Full cognitive graph editing with comprehensive undo/redo support  
          - **Plugin System**: Extensible unparsing system supporting C#, JavaScript, and Python
          - **Enhanced Location Tracking**: Precise APIs for syntax tree navigation and manipulation
          - **Context-Aware Editing**: Advanced context-aware editing capabilities for intelligent code generation

          ### Developer Experience
          - **Comprehensive Testing**: 157 unit tests covering all functionality with 100% pass rate
          - **CI/CD Pipeline**: Fully automated builds, testing, quality checks, and releases
          - **Rich Documentation**: Complete API documentation with examples and integration guides
          - **High Performance**: Optimized parsing algorithms and efficient graph operations

          ### Installation

          ```bash
          dotnet add package DevelApp.Minotaur --version 1.0.0
          ```

          ### Requirements
          - .NET 8.0 or later
          - Compatible with Windows, macOS, and Linux

          This release represents a stable, production-ready version of Minotaur suitable for integration into development workflows and toolchains.
        draft: false
        prerelease: false
        files: ./packages/*.nupkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish v1.0.0 to GitHub Packages
      run: |
        echo "Publishing v1.0.0 to GitHub Packages..."
        dotnet nuget push ./packages/*.nupkg \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
          --skip-duplicate
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Failure-context convention (cf. sbob-choco.yml PR-comment step and
  # SBOB-Forge ci.yml): push runs to main have no PR to comment on, so a
  # failed release lane is otherwise invisible - on 2026-11-03 the stable
  # release lane was silently dead for two days (six merges, no release).
  # On any failed job in a main push run, open an issue so it surfaces.
  report-push-failure:
    runs-on: ubuntu-latest
    needs: [calculate-version, build-and-test, code-quality, lint-and-format, performance-test, package, sign, prerelease, release]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure')
    permissions:
      issues: write
    steps:
      - name: Open a failure report issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          failed_jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(", ")' || echo "unknown")"
          printf 'The push run for %s failed.\n\nFailed jobs: %s\n\nRun: https://github.com/%s/actions/runs/%s\n' "${{ github.sha }}" "$failed_jobs" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "ci: main push run failed (${{ github.sha }})" --body-file /tmp/body.md || echo "issue creation failed (report manually)"

  cleanup:
    runs-on: ubuntu-latest
    needs: [build-and-test, package]
    if: always()
    steps:
    - name: Cleanup artifacts (if needed)
      run: echo "Pipeline completed. Artifacts preserved for download."
