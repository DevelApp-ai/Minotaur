name: Windows diagnostic 2 (temporary - remove before merge)

# Temporary diagnostic for #216/#215: probe which NUGET_AUTH_TOKEN source the
# hardened quality.yml resolves to and whether the 403 clears with longer
# retries. DELETE THIS FILE BEFORE MERGING feat/parser-runtime-127.

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

env:
  NUGET_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOTNET_VERSION: '8.0.x'

jobs:
  windows-diagnostic:
    name: Windows restore diagnostic 2
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Token source probe + restore with long retries
      shell: bash
      run: |
        set +e
        if [ -n "${NUGET_AUTH_TOKEN:-}" ]; then
          TOKEN_LEN=${#NUGET_AUTH_TOKEN}
          if [ "$TOKEN_LEN" -gt 60 ]; then
            echo "NUGET_AUTH_TOKEN source: looks like the PACKAGES_READ_TOKEN org secret (length $TOKEN_LEN, ghp_ style GITHUB_TOKENs are shorter)"
          else
            echo "NUGET_AUTH_TOKEN source: looks like GITHUB_TOKEN fallback (length $TOKEN_LEN)"
          fi
        else
          echo "NUGET_AUTH_TOKEN source: EMPTY"
        fi
        {
          for attempt in 1 2 3 4 5 6 7 8; do
            echo ""
            echo "## restore attempt $attempt ($(date -u +%H:%M:%SZ))"
            if dotnet restore src/Minotaur.sln; then
              echo "RESTORE_OK_ON_ATTEMPT=$attempt"
              break
            fi
            if [ "$attempt" = "8" ]; then echo "RESTORE_FAILED_ALL_ATTEMPTS"; fi
            sleep 20
          done
          echo ""
          echo "## dotnet build (only if restore succeeded)"
          dotnet build src/Minotaur.sln --no-restore --configuration Release
          echo "BUILD_EXIT_CODE=$?"
        } > diag.log 2>&1
        tail -100 diag.log > diag-tail.txt
        PR_NUM=$(jq -r '.number // empty' "$GITHUB_EVENT_PATH")
        if [ -n "$PR_NUM" ]; then
          {
            echo "**Windows diagnostic 2 output (temporary workflow):**"
            echo '~~~'
            cat diag-tail.txt
            echo '~~~'
          } > diag-body.txt
          gh pr comment "$PR_NUM" --repo "$GITHUB_REPOSITORY" --body-file diag-body.txt || echo "comment failed"
        fi
