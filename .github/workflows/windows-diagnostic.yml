name: Windows diagnostic (temporary - remove before merge)

# Temporary diagnostic for issue #127 PR: the windows build-matrix lane fails
# in ~2 minutes with no readable logs via the API. This mirrors the lane's
# restore+build and posts the captured output as a PR comment. DELETE THIS
# FILE BEFORE MERGING feat/parser-runtime-127.

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

env:
  NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOTNET_VERSION: '8.0.x'

jobs:
  windows-diagnostic:
    name: Windows restore+build diagnostic
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Capture restore and build output
      shell: bash
      run: |
        set +e
        {
          echo "## git eol state"
          git config --show-origin --get core.autocrlf || echo "core.autocrlf unset"
          git ls-files --eol docs/corpus/issue-127/ || true
          echo ""
          echo "## dotnet restore src/Minotaur.sln"
          dotnet restore src/Minotaur.sln
          echo "RESTORE_EXIT_CODE=$?"
          echo ""
          echo "## dotnet build src/Minotaur.sln --no-restore --configuration Release"
          dotnet build src/Minotaur.sln --no-restore --configuration Release
          echo "BUILD_EXIT_CODE=$?"
        } > diag.log 2>&1
        tail -120 diag.log > diag-tail.txt
        PR_NUM=$(jq -r '.number // empty' "$GITHUB_EVENT_PATH")
        if [ -n "$PR_NUM" ]; then
          {
            echo "**Windows diagnostic output (temporary workflow, branch feat/parser-runtime-127):**"
            echo '~~~'
            cat diag-tail.txt
            echo '~~~'
          } > diag-body.txt
          gh pr comment "$PR_NUM" --repo "$GITHUB_REPOSITORY" --body-file diag-body.txt || echo "comment failed"
        else
          cat diag-tail.txt
        fi
